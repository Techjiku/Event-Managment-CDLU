name: Apply Supabase schema

on:
  push:
    branches:
      - main
      - master
    paths:
      - supabase_schema.sql
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # Project references are identifiers, not credentials. Keeping this
          # value in the workflow avoids environment/repository variable scope
          # mismatches while keeping the database credentials secret.
          SUPABASE_PROJECT_REF: mloifpvurnppsykpjtgc
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_DB_PASSWORD"
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db query --linked --file supabase_schema.sql
