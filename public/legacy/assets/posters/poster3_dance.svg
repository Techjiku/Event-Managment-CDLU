<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="danceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="40%" stop-color="#831843" />
      <stop offset="75%" stop-color="#431407" />
      <stop offset="100%" stop-color="#18040b" />
    </linearGradient>
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <linearGradient id="yellowDance" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="750" fill="url(#danceBg)" />

  <!-- Ambient light -->
  <circle cx="300" cy="220" r="300" fill="#f43f5e" opacity="0.25" />
  <circle cx="1300" cy="480" r="320" fill="#f59e0b" opacity="0.2" />

  <!-- Decorative Mandala & Dance Circular Motifs -->
  <g opacity="0.18" stroke="#fb7185" stroke-width="2" fill="none">
    <circle cx="800" cy="375" r="320" stroke-dasharray="8 8" />
    <circle cx="800" cy="375" r="260" />
    <circle cx="800" cy="375" r="200" stroke-dasharray="12 12" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(800, 100)" text-anchor="middle">
    <rect x="-260" y="-25" width="520" height="50" rx="25" fill="#ffffff" fill-opacity="0.1" stroke="#f43f5e" stroke-width="1.5" />
    <text y="7" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#fecdd3" letter-spacing="3">
      13th TRIVENI YUVA MAHOTSAV 2026 • CDLU
    </text>
  </g>

  <!-- Category Title -->
  <g transform="translate(800, 230)" text-anchor="middle">
    <text font-family="'Segoe UI', sans-serif" font-weight="900" font-size="78" fill="#ffffff" letter-spacing="2">
      NRITYA TARANG
    </text>
    <text y="68" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="52" fill="url(#yellowDance)" letter-spacing="4">
      FOLK &amp; CLASSICAL DANCE
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(800, 360)" text-anchor="middle">
    <text font-family="'Segoe UI', sans-serif" font-weight="500" font-size="20" fill="#ffe4e6" letter-spacing="2">
      Haryanvi Group Dance • Classical Dance Solo • Creative Choreography • General Group Dance
    </text>
  </g>

  <!-- Event Grid Highlights -->
  <g transform="translate(800, 480)">
    <g transform="translate(-480, 0)">
      <rect x="-105" y="-45" width="210" height="90" rx="14" fill="#881337" fill-opacity="0.6" stroke="#fb7185" stroke-width="1.2" />
      <text y="-10" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#ffffff" text-anchor="middle">Haryanvi Group</text>
      <text y="16" font-family="'Segoe UI', sans-serif" font-size="13" fill="#fecdd3" text-anchor="middle">Dhamal, Khoria, Phag</text>
    </g>
    <g transform="translate(-160, 0)">
      <rect x="-105" y="-45" width="210" height="90" rx="14" fill="#881337" fill-opacity="0.6" stroke="#fb7185" stroke-width="1.2" />
      <text y="-10" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#ffffff" text-anchor="middle">Classical Solo</text>
      <text y="16" font-family="'Segoe UI', sans-serif" font-size="13" fill="#fecdd3" text-anchor="middle">Kathak &amp; Bharatnatyam</text>
    </g>
    <g transform="translate(160, 0)">
      <rect x="-105" y="-45" width="210" height="90" rx="14" fill="#881337" fill-opacity="0.6" stroke="#fb7185" stroke-width="1.2" />
      <text y="-10" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#ffffff" text-anchor="middle">Choreography</text>
      <text y="16" font-family="'Segoe UI', sans-serif" font-size="13" fill="#fecdd3" text-anchor="middle">Theme Formations (8-12)</text>
    </g>
    <g transform="translate(480, 0)">
      <rect x="-105" y="-45" width="210" height="90" rx="14" fill="#881337" fill-opacity="0.6" stroke="#fb7185" stroke-width="1.2" />
      <text y="-10" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#ffffff" text-anchor="middle">Folk Regional</text>
      <text y="16" font-family="'Segoe UI', sans-serif" font-size="13" fill="#fecdd3" text-anchor="middle">Bhangra, Garba, Giddha</text>
    </g>
  </g>

  <!-- Venue Details -->
  <g transform="translate(800, 630)" text-anchor="middle">
    <rect x="-290" y="-24" width="580" height="48" rx="24" fill="url(#yellowDance)" />
    <text y="8" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="18" fill="#4c0519" letter-spacing="2">
      VENUE: OPEN AIR THEATRE (STAGE II) &amp; AUDITORIUM
    </text>
  </g>
</svg>
